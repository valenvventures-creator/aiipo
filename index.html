<style>/* Thought Authorities A.I. IPO - ivory, ink and crest gold */
:root {
  --ink: #0f1d2b;
  --ink-2: #1b2f42;
  --ink-soft: #3c4f62;
  --ivory: #fbf8f1;
  --parch: #f3ecdc;
  --card: #ffffff;
  --line: #e4dccb;
  --line-strong: #cfc3a8;
  --gold: #e9b51f;
  --gold-deep: #9a7209;
  --gold-tint: #fbf1d0;
  --teal: #1e5560;
  --ok: #1d6b3f;
  --ok-bg: #e5f3ea;
  --warn: #9b2c1f;
  --warn-bg: #fbe9e5;
  --info-bg: #eaf1f4;
  --muted: #5d6874;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 1px 2px rgba(15, 29, 43, .06), 0 8px 24px rgba(15, 29, 43, .06);
  --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--sans); font-size: 16px; line-height: 1.6; color: var(--ink); background: var(--ivory); }
img { max-width: 100%; height: auto; }
a { color: var(--teal); text-underline-offset: 3px; }
a:hover { color: var(--ink); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; letter-spacing: -.01em; color: var(--ink); margin: 0 0 .5em; }
h1 { font-size: clamp(2rem, 4vw, 3rem); }
h2 { font-size: clamp(1.4rem, 2.4vw, 2rem); }
h3 { font-size: 1.25rem; }
p { margin: 0 0 1em; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--ink); color: #fff; padding: 8px 12px; z-index: 100; border-radius: 6px; }
.skip:focus { left: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
.narrow { width: min(820px, 100% - 32px); }
.muted { color: var(--muted); }
.fine { font-size: .84rem; color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
.eyebrow { font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--gold-deep); margin-bottom: .75rem; }
.eyebrow-gold { color: var(--gold); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; font: 600 .95rem/1 var(--sans); padding: .8em 1.25em; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; text-decoration: none; transition: background .15s, color .15s, border-color .15s, transform .15s; min-height: 44px; }
.btn:active { transform: translateY(1px); }
.btn-gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.btn-gold:hover { background: #f2c63c; color: var(--ink); }
.btn-outline { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: #fff; }
.btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line-strong); }
.btn-ghost:hover { border-color: var(--ink); color: var(--ink); }
.btn-lg { font-size: 1.02rem; padding: 1em 1.6em; }
.btn-sm { font-size: .85rem; padding: .55em 1em; min-height: 36px; }
.btn-block { width: 100%; }
.link-quiet { color: var(--ink); text-decoration: none; font-weight: 600; }
.link-arrow { font-weight: 600; text-decoration: none; }
.link-arrow::after { content: ' →'; }

/* Brand lockup */
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-crest { width: 62px; height: auto; }
.brand-text { display: flex; flex-direction: column; line-height: 1; }
.brand-wordmark { width: 150px; height: auto; }
.brand-sub { font: 700 .66rem/1 var(--sans); letter-spacing: .32em; color: var(--ink-soft); margin-top: 5px; padding-left: 2px; }

/* Marketing header */
.mkt-header { position: sticky; top: 0; z-index: 20; background: rgba(251, 248, 241, .92); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.mkt-header-in { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 76px; }
.mkt-nav { display: flex; gap: 26px; }
.mkt-nav a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: .93rem; }
.mkt-nav a:hover { color: var(--gold-deep); }
.mkt-cta { display: flex; align-items: center; gap: 18px; }

/* Hero */
.hero { padding: clamp(48px, 8vw, 104px) 0 64px; background: radial-gradient(1200px 500px at 85% -10%, var(--gold-tint), transparent 60%), var(--ivory); }
.hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(28px, 5vw, 72px); align-items: center; }
.hero h1 { font-size: clamp(2.5rem, 5.4vw, 4.4rem); font-weight: 600; }
.hero h1 em { font-style: italic; color: var(--gold-deep); }
.lede { font-size: 1.15rem; color: var(--ink-soft); max-width: 60ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 14px; }
.hero-card { background: var(--ink); color: #e8edf2; border-radius: 20px; padding: 26px; box-shadow: 0 30px 60px rgba(15, 29, 43, .25); border: 1px solid #2a4157; }
.ledger-head { display: flex; justify-content: space-between; align-items: center; font: 700 .8rem/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
.tag-illus { font: 600 .68rem/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: rgba(233, 181, 31, .14); color: var(--gold-deep); border: 1px solid rgba(233, 181, 31, .4); white-space: nowrap; }
.hero-card .tag-illus { color: var(--gold); }
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px dashed #2f4760; font-size: .95rem; }
.l-n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 1.5px solid #4d6680; color: #b9c7d4; }
.l-s { font-size: .8rem; color: #93a6b8; }
.ledger .done .l-n { background: var(--gold); border-color: var(--gold); color: var(--ink); }
.ledger .now .l-n { border-color: var(--gold); color: var(--gold); }
.ledger .now { color: #fff; font-weight: 600; }
.ledger .block .l-s { color: #f2a493; }
.ledger-foot { margin-top: 16px; font-size: .9rem; color: #c9d4de; }
.ledger-foot em { color: var(--gold); font-style: normal; }

.strip { border-block: 1px solid var(--line); background: var(--card); padding: 18px 0 10px; }
.strip-in { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 36px; font: 600 .9rem/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.strip-note { text-align: center; font-size: .75rem; color: var(--muted); margin: 10px auto 0; }

.section { padding: clamp(56px, 8vw, 96px) 0; }
.section-lede { font-size: 1.08rem; color: var(--ink-soft); max-width: 68ch; }
.section-ink { background: var(--ink); color: #dfe7ee; }
.section-ink h2, .section-ink h3 { color: #fff; }
.section-ink .section-lede { color: #b8c6d3; }
.section-parch { background: var(--parch); }

.stage-rail { list-style: none; padding: 0; margin: 32px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; counter-reset: s; }
.stage-rail li { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--gold); }
.rail-n { font: 700 1.6rem/1 var(--serif); color: var(--gold-deep); }
.rail-name { font-weight: 700; }
.rail-owner { font-size: .82rem; color: var(--muted); }

.route-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
.route-cards article { border: 1px solid #2d4560; border-radius: var(--radius); padding: 22px; background: linear-gradient(180deg, #16293b, #122334); }
.route-cards p { color: #b8c6d3; margin: 0; }

.bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 28px; }
.bento article { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.bento .b-wide { grid-column: span 2; background: linear-gradient(135deg, var(--card), var(--gold-tint)); }
.bento p { margin: 0; color: var(--ink-soft); }

.numbers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.calc-sample { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.calc-sample caption { text-align: left; font-size: .8rem; color: var(--muted); padding-bottom: 8px; }
.calc-sample th, .calc-sample td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: left; font-size: .94rem; }
.calc-sample td { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.calc-sample th { font-weight: 500; color: var(--ink-soft); }
.calc-sample tr.em td, .calc-sample tr.em th { background: var(--gold-tint); color: var(--ink); font-weight: 700; }

.sec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 28px 0; }
.sec-grid article { border-left: 3px solid var(--gold); padding: 4px 0 4px 16px; }
.sec-grid p { color: var(--ink-soft); margin: 0; }
.sec-list div { padding: 18px 0; border-bottom: 1px solid var(--line); }
.sec-list dt { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; }
.sec-list dd { margin: 4px 0 0; color: var(--ink-soft); }
.prose p { color: var(--ink-soft); }

.faq { border-bottom: 1px solid var(--line-strong); padding: 6px 0; }
.faq summary { cursor: pointer; list-style: none; font-weight: 700; padding: 14px 32px 14px 0; position: relative; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; position: absolute; right: 4px; top: 10px; font-size: 1.4rem; color: var(--gold-deep); }
.faq[open] summary::after { content: '−'; }
.faq p { color: var(--ink-soft); }

.closing { background: var(--ink); padding: 72px 0; text-align: center; }
.closing-in { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.closing h2 { color: #fff; max-width: 22ch; }

.mkt-footer { background: #0b1621; color: #a9b7c4; padding: 56px 0 28px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 28px; }
.footer-grid h3 { font: 700 .78rem/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; }
.footer-grid a { display: block; color: #d5dee6; text-decoration: none; padding: 4px 0; }
.footer-grid a:hover { color: var(--gold); }
.footer-logo { width: 130px; margin-bottom: 10px; }
.mkt-footer .muted { color: #8fa0b0; }
.footer-legal { border-top: 1px solid #22344a; margin-top: 36px; padding-top: 20px; font-size: .8rem; color: #8193a4; }

/* Auth */
.auth-grid { display: grid; grid-template-columns: minmax(320px, 0.9fr) 1.1fr; min-height: 100vh; }
.auth-panel { background: radial-gradient(700px 400px at 30% 20%, #1d3550, var(--ink)); color: #dbe4ec; padding: 48px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 12px; }
.auth-logo img { width: min(260px, 60vw); filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .35)); }
.auth-tag { font: 700 .82rem/1.5 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin: 18px 0 0; max-width: 30ch; }
.auth-sub { font-family: var(--serif); font-size: 1.3rem; font-style: italic; color: #fff; }
.auth-points { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; color: #9fb1c2; }
.auth-points li::before { content: '◆ '; color: var(--gold); font-size: .7em; }
.auth-main { display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
.auth-card { width: min(460px, 100%); }
.auth-card.wide { width: min(760px, 100%); }
.auth-card h1 { font-size: 2.4rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-gap { display: flex; flex-direction: column; gap: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: .9rem; }
input, select, textarea { font: 400 1rem/1.4 var(--sans); padding: 11px 12px; border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); background: #fff; color: var(--ink); width: 100%; min-height: 44px; }
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: 3px solid var(--gold-tint); }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; min-height: 0; accent-color: var(--ink); flex: none; }
label.check { flex-direction: row; align-items: center; gap: 10px; font-weight: 500; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .92rem; }
.hint { font-size: .82rem; color: var(--muted); margin: -6px 0 0; }
.form-error { background: var(--warn-bg); color: var(--warn); border: 1px solid #efc2b8; padding: 10px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: .92rem; margin-bottom: 12px; }
.form-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #b9dcc6; padding: 10px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: .92rem; margin-bottom: 12px; }
.field-error { color: var(--warn); font-weight: 600; font-size: .82rem; }
.demo-box { margin-top: 28px; padding: 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius); background: var(--parch); }
.demo-box h2 { font-size: 1.3rem; }
.demo-box p { font-size: .9rem; color: var(--ink-soft); }
.auth-switch { margin-top: 22px; text-align: center; font-size: .93rem; }
.demo-options { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.demo-option { flex-direction: row; align-items: flex-start; gap: 12px; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm); background: #fff; cursor: pointer; }
.demo-option:has(input:checked) { border-color: var(--ink); background: var(--gold-tint); }
.demo-option span { display: flex; flex-direction: column; }
.demo-option small { color: var(--muted); font-weight: 400; }
.outbox-item { border-top: 1px solid var(--line); padding: 14px 0; }
.outbox-item pre { white-space: pre-wrap; word-break: break-all; background: var(--parch); padding: 12px; border-radius: var(--radius-sm); font-size: .85rem; }

/* App shell */
body.app { background: #f6f2e8; }
.demo-bar { background: var(--gold); color: var(--ink); font-size: .86rem; font-weight: 600; text-align: center; padding: 8px 16px; }
.demo-bar a { color: var(--ink); }
.app-grid { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.sidebar { background: var(--ink); color: #c9d4de; display: flex; flex-direction: column; padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-brand { padding: 4px 8px 18px; border-bottom: 1px solid #253a50; margin-bottom: 12px; }
.sidebar .brand { color: #fff; }
.sidebar .brand-sub { color: #9fb1c2; }
.sidebar .brand-crest { width: 50px; }
.sidebar .brand-wordmark { width: 128px; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar nav a, .guide-link { color: #c9d4de; text-decoration: none; padding: 9px 12px; border-radius: 8px; font-size: .92rem; font-weight: 500; display: block; }
.sidebar nav a:hover, .guide-link:hover { background: #1a2d40; color: #fff; }
.sidebar nav a.active, .guide-link.active { background: #213a52; color: #fff; box-shadow: inset 3px 0 0 var(--gold); }
.sidebar-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid #253a50; }
.guide-link { border: 1px solid #355571; color: var(--gold); font-weight: 700; text-align: center; }
.app-main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 12px 28px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
.project-switch select { min-height: 38px; padding: 6px 10px; font-weight: 600; max-width: 340px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.role-chip { font-size: .78rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--info-bg); color: var(--teal); }
.chip-warn { font-size: .78rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); text-decoration: none; }
.user-name { font-weight: 600; font-size: .9rem; }

.cls-public, .cls-approved { border-color: #b9dcc6; color: var(--ok); }
.label-src { font-size: .74rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: #eceef1; }

/* ---------- Brand lockup (original crest + wordmark artwork, arranged on a fixed grid) ---------- */
.lockup { --crest-h: 52px; --word-w: 132px; --sub-size: 9.5px; --gap: 4px; --div-space: 14px;
  display: inline-flex; align-items: center; text-decoration: none; line-height: 1; color: var(--gold-deep); }
.lockup img { display: block; max-width: none; }

.lk-word { width: 100%; height: auto; }
.lk-sub { display: flex; align-items: center; gap: .75em; font: 700 var(--sub-size)/1 var(--sans); letter-spacing: .42em; text-transform: uppercase; white-space: nowrap; }

.lk-divider { width: 1px; align-self: stretch; margin: 2px var(--div-space); background: currentColor; opacity: .35; flex: none; }
.lockup-dark { color: var(--gold); }
.lockup-dark .lk-divider { opacity: .45; }
.lockup:hover { opacity: .92; }

/* Horizontal: crest height equals the wordmark + label block, so all three share top and bottom edges */
.lockup-h.lockup-md { --crest-h: 52px; --word-w: 132px; --sub-size: 9.5px; --gap: 4px; }

.lockup-v .lk-text { margin-top: var(--stack-gap, 10px); }
.lockup-v.lockup-sm { --crest-h: 50px; --word-w: 148px; --sub-size: 9px; --gap: 6px; --stack-gap: 10px; }

@media (max-width: 560px) {

  .mkt-header-in { min-height: 68px; }
}
.footer-grid a.lockup { display: inline-flex; padding: 0; color: var(--gold); }
.footer-grid a.lockup:hover { color: var(--gold); }

<section class="section" id="route">
  <div class="wrap">
    <p class="eyebrow">The route</p>
    <h2>Eleven stages. Every gate explained.</h2>
    <p class="section-lede">Each stage has a populated procedure - owner, inputs, steps, evidence, reviewer and exit criteria. Gates stay closed until the evidence is there, and a material change reopens what it affects.</p>
    <ol class="stage-rail">
      <li><span class="rail-n">0</span><span class="rail-name">Assess strategic fit</span><span class="rail-owner">CEO and board</span></li><li><span class="rail-n">1</span><span class="rail-name">Select route and assemble the team</span><span class="rail-owner">CFO or IPO project lead</span></li><li><span class="rail-n">2</span><span class="rail-name">Remediate finance and reporting</span><span class="rail-owner">CFO and controller</span></li><li><span class="rail-n">3</span><span class="rail-name">Resolve legal structure and governance</span><span class="rail-owner">Securities counsel and corporate secretary</span></li><li><span class="rail-n">4</span><span class="rail-name">Conduct diligence and prepare disclosure</span><span class="rail-owner">Securities counsel</span></li><li><span class="rail-n">5</span><span class="rail-name">Manage regulatory and exchange review</span><span class="rail-owner">Securities counsel and filing professional</span></li><li><span class="rail-n">6</span><span class="rail-name">Prepare communications and market the offering</span><span class="rail-owner">Issuer and authorized underwriters</span></li><li><span class="rail-n">7</span><span class="rail-name">Price and authorize the transaction</span><span class="rail-owner">Board or pricing committee</span></li><li><span class="rail-n">8</span><span class="rail-name">Close and begin trading</span><span class="rail-owner">Counsel</span></li><li><span class="rail-n">9</span><span class="rail-name">Manage the first ninety days</span><span class="rail-owner">CFO, corporate secretary, counsel, IR</span></li><li><span class="rail-n">10</span><span class="rail-name">Operate as a public company</span><span class="rail-owner">Management and board</span></li>
    </ol>
  </div>
</section>

<section class="section section-ink" id="routes">
  <div class="wrap">
    <p class="eyebrow eyebrow-gold">Jurisdiction routing</p>
    <h2>Incorporation is not destiny.</h2>
    <p class="section-lede">Where you are incorporated, where you are run from, where you offer and where you list are separate facts. The routing engine keeps them separate - and shows what it does not yet know.</p>
    <div class="route-cards">
      <article><h3>Canadian conventional IPO</h3><p>Provincial and territorial prospectus, exchange application, underwriting and continuous disclosure. Principal regulator confirmed with counsel.</p></article>
      <article><h3>US domestic IPO</h3><p>Registration statement, SEC review, FINRA where applicable, exchange listing and Exchange Act reporting - with EGC, SRC and filer status assessed separately.</p></article>
      <article><h3>Canadian company in the US</h3><p>A real foreign private issuer test, not an assumption. MJDS screened on its own conditions - a newly public company is not automatically eligible.</p></article>
      <article><h3>Concurrent Canada &amp; US</h3><p>Both sets of obligations, currencies, selling restrictions and settlement in one coordinated plan with a conflict log.</p></article>
    </div>
  </div>
</section>

<section class="section" id="workspace">
  <div class="wrap">
    <p class="eyebrow">The workspace</p>
    <h2>Real records, not a reading list.</h2>
    <div class="bento">
      <article class="b-wide"><h3>Your next three actions</h3><p>The dashboard shows the active stage, unblocked work, critical blockers, waiting reviews and what changed - without a misleading single readiness percentage.</p></article>
      <article><h3>Claims ledger</h3><p>Every material number in your disclosure is linked to its source. Change it, and every dependent approval reopens.</p></article>
      <article><h3>Communications clearance</h3><p>Retail promotion before filing is held for counsel automatically. Institutional testing-the-waters stays available where permitted.</p></article>
      <article><h3>Secure data room</h3><p>Folder classifications, encrypted versions, legal holds, access logs and content screening.</p></article>
      <article><h3>Advisor directory</h3><p>Verification routes to official registries. "Official source" is never confused with "credentials checked".</p></article>
      <article class="b-wide"><h3>Public company operations</h3><p>Closing the IPO project activates recurring obligations. They cannot be erased by marking a project complete.</p></article>
    </div>
  </div>
</section>

  <div class="wrap numbers-grid">

      <h2>Company cash is not deal size.</h2>
      <p class="section-lede">Deterministic decimal engines separate primary and secondary shares, the over-allotment option and who bears which costs - with formulas and assumptions exported alongside every result.</p>

<section class="section" id="security">
  <div class="wrap">
    <p class="eyebrow">Security</p>
    <h2>Built for material non-public information.</h2>
    <div class="sec-grid">
      <article><h3>Encrypted twice over</h3><p>TLS in transit. Sensitive fields and every file encrypted at rest with AES-256-GCM, bound to your organization.</p></article>
      <article><h3>Least privilege</h3><p>Twelve roles and seven information classifications. A PR guest cannot reach privileged material through pages, search, exports or the A.I. guide.</p></article>
      <article><h3>Strong sign-in</h3><p>scrypt password hashing, authenticator-app MFA, lockout after repeated failures, short browser-bound sessions.</p></article>
      <article><h3>Tamper-evident trail</h3><p>Hash-chained audit events and append-only approvals and versions. Approved history is never overwritten.</p></article>
    </div>
    <p><a class="link-arrow" href="#/security">Read the security overview</a></p>
  </div>
</section>

<section class="section section-parch" id="faq">
  <div class="wrap narrow">
    <p class="eyebrow">Questions, answered</p>
    <h2>Before you begin</h2>
    <details class="faq"><summary>Does the software decide whether we can go public?</summary><p>No. It organizes facts, evidence and tasks, and gives provisional route comparisons. Securities counsel, auditors, underwriters, regulators and exchanges make their own determinations. A software match means &#34;potential fit pending professional assessment&#34;.</p></details><details class="faq"><summary>Which routes are supported?</summary><p>The pilot covers a Canadian conventional IPO, a US domestic IPO, a foreign private issuer assessment for US routes, MJDS eligibility screening and concurrent Canada-US coordination. Specialist sectors enter a specialist assessment with named missing requirements.</p></details><details class="faq"><summary>How is our data protected?</summary><p>Sensitive fields and every uploaded file are encrypted with AES-256-GCM using per-tenant bound keys, sessions are short-lived and bound to the browser, MFA is available to every user and required for restricted, MNPI and privileged material, and every consequential action is written to a tamper-evident audit trail.</p></details><details class="faq"><summary>What does the A.I. guide do?</summary><p>It explains concepts, finds your next unblocked task, assembles questions for your advisors and drafts for review. It only sees what you are cleared to see, cites only registered sources and never issues legal, tax or audit conclusions.</p></details><details class="faq"><summary>Is the financial math done by the A.I.?</summary><p>No. Proceeds, dilution, ownership and runway are calculated by deterministic decimal engines with stated formulas and exportable assumptions. The A.I. can explain results; it never computes authoritative figures.</p></details><details class="faq"><summary>Can we just look around first?</summary><p>Yes. The live demo creates an isolated workspace for a clearly fictional company with seeded, labelled data. It is deleted automatically.</p></details>
  </div>
</section>

<main id="main"><section class="section"><div class="wrap narrow">
      <p class="eyebrow">Security overview</p><h1>How we protect sensitive client information</h1>
      <p class="section-lede">These controls are implemented in this software. Certifications (such as SOC 2) and formal penetration testing are separate work that must be completed before any compliance claim is made.</p>
      <dl class="sec-list"><div><dt>Transport</dt><dd>HTTPS only in production with HSTS; strict Content Security Policy with no inline script; framing blocked; no referrer leakage.</dd></div><div><dt>Authentication</dt><dd>Passwords hashed with scrypt (N&#61;2^15). Generic sign-in errors, constant-time comparison and dummy hashing prevent account discovery. Accounts lock temporarily after repeated failures. Rate limits on sign-in, sign-up, reset and demo creation.</dd></div><div><dt>Multi-factor authentication</dt><dd>RFC 6238 authenticator codes with replay protection and single-use recovery codes. Required before any restricted personal information, MNPI or privileged material is shown.</dd></div><div><dt>Sessions</dt><dd>Random 256-bit tokens stored only as hashes, HttpOnly + Secure + SameSite cookies with the __Host- prefix, idle and absolute timeouts, browser binding, rotation at sign-in and revocation of other sessions after a password change.</dd></div><div><dt>Encryption at rest</dt><dd>Names, emails, company profiles, records, notes and file names are encrypted field-by-field with AES-256-GCM using keys derived from a master key held outside the database. Every file has its own data key. Ciphertexts are bound to their tenant and record, so copied data fails to decrypt.</dd></div><div><dt>Tenant isolation and least privilege</dt><dd>Every query is scoped to the signed-in organization. Twelve roles and seven classifications control pages, downloads, exports, notifications and A.I. retrieval alike. Records you cannot read return &#34;not found&#34;.</dd></div><div><dt>Integrity and audit</dt><dd>Hash-chained audit log; database triggers make approvals, versions, task history and access logs append-only. Legal holds block deletion.</dd></div><div><dt>Uploads</dt><dd>Allow-listed types verified by content signature, size limits, executable and test-signature screening, SHA-256 integrity check on every download. Production deployments should add a full antivirus engine.</dd></div><div><dt>Forms and requests</dt><dd>Per-session CSRF tokens plus origin checks, request size limits, strict input validation, output encoding by default and spreadsheet-formula injection guards on exports.</dd></div><div><dt>A.I. safety</dt><dd>Workspace content is treated as untrusted data; the guide cannot follow instructions inside documents, cites only registered sources and never sees material above your clearance. Customer deal data is not used for training by this application.</dd></div></dl>
    </div></section></main>

final prospectus","https://d18rn0p25nwr6d.cloudfront.net/CIK-0001682852/d5286af7-ecaa-4afd-9f73-93e28b998552.pdf"],C08:["Rivian","2021 Form 10-K","https://www.sec.gov/Archives/edgar/data/1874178/000187417822000008/rivn-20211231.htm"],C09:["Blue Apron","2017 final prospectus","https://www.sec.gov/Archives/edgar/data/1701114/000104746917004316/a2232581z424b4.htm"],C10:["Blue Apron","2017 results exhibit","https://www.sec.gov/Archives/edgar/data/1701114/000155837018000612/ex-99d1.htm"],C11:["The We Company","Sept 3 2019 registration amendment","https://www.sec.gov/Archives/edgar/data/1533523/000119312519236798/d781982ds1a.htm"],C12:["WeWork","2021 Form 10-K","https://www.sec.gov/Archives/edgar/data/1813756/000181375622000003/we-20211231.htm"]},he=[["IPO","Initial public offering: the first sale of a company's securities to the public under a prospectus or registration statement, usually alongside a stock-exchange listing."],["Prospectus","The disclosure document filed with Canadian securities regulators (and the core of a US registration statement) describing the company, its risks and the offering."],["Registration statement","The SEC filing (e.g. Form S-1 or F-1) that registers securities for a US public offering."],["Receipt","In Canada, the regulator's document confirming a prospectus has been accepted for filing; a final receipt allows distribution."],["Effectiveness","In the US, the point when the SEC declares a registration statement effective so securities can be sold."],["FPI","Foreign private issuer: a non-US company meeting SEC Rule 405 tests; it can use foreign-issuer forms such as F-1 and 20-F."],["MJDS","Multijurisdictional disclosure system: lets eligible Canadian issuers use Canadian disclosure for certain US filings (e.g. F-10, 40-F)."],["EGC","Emerging growth company: a US status with scaled disclosure and other accommodations, based mainly on revenue."],["SRC","Smaller reporting company: a US status, based on public float and revenue, allowing scaled disclosure."],["Public float","The market value of shares held by non-affiliates."],["Venture issuer","A Canadian reporting issuer without securities listed on senior marketplaces such as the TSX, Cboe Canada or US exchanges, as defined in the applicable rule."],["Primary shares","New shares issued by the company; proceeds go to the company."],["Secondary shares","Existing shares sold by current holders; proceeds go to those sellers, not the company."],["Over-allotment option","An option for underwriters to buy additional shares (often called the greenshoe), which may be primary, secondary or both."],["Underwriting discount","The compensation retained by underwriters, typically a percentage of gross proceeds."],["NTBV dilution","The difference between the offering price and post-offering net tangible book value per share."],["Lock-up","A contractual agreement restricting holders from selling for a period after the IPO."],["Testing the waters","Permitted communications with certain investors to gauge interest before or after filing (e.g. SEC Rule 163B), subject to conditions."],["Quiet period","An informal term for offering-period communication restrictions; the actual rules depend on jurisdiction and stage."],["MNPI","Material non-public information."],["SOX 404","Sarbanes-Oxley section 404: 404(a) management assessment of internal control; 404(b) auditor attestation, with timing relief for some issuers."],["NI 52-109","Canadian instrument on certification of disclosure in annual and interim filings."],["PBC list",'"Prepared by client" list of items the auditor requests from management.'],["Comfort letter","A letter from auditors to underwriters about financial information in the offering document."],["SEDAR+","The Canadian securities administrators' national filing system."],["EDGAR Next","The SEC's updated EDGAR access and account management framework with individual roles."],["CPC","Capital pool company program of the TSX Venture Exchange."],["RTO","Reverse takeover: a private company becomes public by combining with a listed company."],["SPAC","Special purpose acquisition company."],["Non-GAAP measure","A financial measure not defined by the accounting framework; subject to SEC rules and NI 52-112."]],te=[{n:1,title:"Understanding public markets and alternatives",text:"An IPO raises capital and creates liquidity, but brings permanent reporting, governance and cost obligations. Alternatives include private equity, venture debt, strategic sale, direct listings, CPC qualifying transactions, RTOs and SPAC combinations - each with separate risks and requirements, and none is automatically cheaper or faster.",example:"A profitable industrial company may meet its growth plan with a private round and revisit listing in three years.",check:{q:"Does completing an IPO end the company's regulatory obligations?",a:["Yes, once shares trade","No - public-company obligations continue indefinitely"],correct:1},action:["Document your objectives","/app/onboarding?section=objectives"]},{n:2,title:"Choosing a jurisdiction and route",text:"Place of incorporation, head office, where securities are offered and where they list are separate facts. Canadian filing follows where securities are distributed; US form choice depends on FPI status, not simply on being Canadian.",example:"A BC company listing on Nasdaq with 60% US holders and US-based management may not be an FPI.",check:{q:"Is a Canadian company automatically eligible to use Form F-10?",a:["Yes","No - MJDS has its own eligibility conditions"],correct:1},action:["Review your route assessment","/app/roadmap"]},{n:3,title:"Building your professional team",text:"Issuer counsel, an appropriately registered auditor, underwriters, transfer agent, filing agent and IR support each own distinct work. Verify the specific legal entity and individuals against official registries.",example:"Check a dealer on CIRO's directory and FINRA BrokerCheck; check an audit firm on CPAB and PCAOB lists.",check:{q:"Does a firm's marketing page prove its licensing?",a:["Yes","No - verify against official registries"],correct:1},action:["Open the advisor directory","/app/advisors"]},{n:4,title:"Reading financial statements and preparing for audit",text:"Required periods depend on route and relief. The CFO prepares statements; the auditor independently audits them. Uploading an audit report is evidence, not approval of a filing.",example:"Canada's 2025 coordinated relief can change historical statement requirements - subject to conditions.",check:{q:"Who issues an audit opinion?",a:["The software","The independent auditor"],correct:1},action:["Record your financial periods","/app/finance"]},{n:5,title:"Ownership and governance",text:"Cap tables must reconcile to signed records. Boards need independence and committees per exchange rules, often with phase-ins. Multiple-vote structures need specialist review.",example:"A missing board consent for an option grant may need ratification before filing.",check:{q:"Are economic and voting percentages the same measure?",a:["Always","No - especially with multiple-vote classes"],correct:1},action:["Open the capitalization register","/app/legal"]},{n:6,title:"Diligence and prospectus disclosure",text:"Every material statement needs a source. A claims ledger links numbers to evidence so changes reopen reviews of dependent documents.",example:'"Customers grew 40%" must specify period, definition and source.',check:{q:"Can an unsupported numeric claim be approved for external use?",a:["Yes","No"],correct:1},action:["Register a disclosure claim","/app/disclosure"]},{n:7,title:"Valuation and fundraising",text:"Enterprise value and equity value differ by net debt and other adjustments. Bankers set price ranges through their process; software scenarios are illustrative.",example:"EV of $500M with $50M net cash implies equity value of about $550M before other adjustments.",check:{q:"Do secondary sales increase company cash?",a:["Yes","No"],correct:1},action:["Run the proceeds calculator","/app/capital"]},{n:8,title:"Permitted communications and roadshows",text:"Communications during an offering are regulated by jurisdiction and stage. Classify every communication; counsel clears specific versions for specific audiences.",example:"An institutional testing-the-waters deck may be permitted while retail advertising is not.",check:{q:"Is ordinary marketing automatically exempt during an offering?",a:["Yes","No - it must be classified in context"],correct:1},action:["Submit a communication request","/app/communications"]},{n:9,title:"Pricing and closing",text:"Pricing, first trade and closing are separate events. Closing requires evidence for every deliverable and verified wire instructions.",example:"Conditional listing approval is not final authorization.",check:{q:"Should changed wire instructions received by email be used directly?",a:["Yes","No - verify independently"],correct:1},action:["Open the closing checklist","/app/tasks"]},{n:10,title:"The first year as a public company",text:"Recurring filings, certifications, insider reporting, disclosure controls and governance continue indefinitely. Reassess classifications annually and on events.",example:"Losing FPI status brings domestic US reporting forms.",check:{q:"Can completing the IPO project erase recurring obligations?",a:["Yes","No"],correct:1},action:["Review public company operations","/app/public-company"]}],ve=[{name:"Shopify 2015",obs:"Announced a US$17 offering with Canadian and US listing arrangements; the closing announcement reported gross proceeds including the exercised over-allotment option.",lesson:"Coordinate two markets; distinguish base offering, option exercise, gross proceeds and net issuer cash.",tool:"Dual-market checklist; proceeds reconciliation",src:["C01","C02"]},{name:"Coveo 2021",obs:"Canadian IPO pricing announcement described the final base PREP prospectus, C$15 pricing and conditional TSX approval.",lesson:"Separate prospect
