# Generated by scripts/build-static.js. Without BACKEND_URL: static preview only (no accounts).
# With BACKEND_URL set in Netlify: the site forwards to the full app server (see scripts/netlify-build.js).
[build]
  command = "node scripts/netlify-build.js"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
