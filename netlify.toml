# Thought Authorities A.I. IPO on Netlify - same model as the other Thought Authorities sites:
# Netlify Functions (app), Netlify Database (accounts and data), Netlify Blobs (encrypted documents).
[build]
  command = "npm test"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Embedded Postgres is only for local development and tests; production uses Netlify Database.
  external_node_modules = ["@electric-sql/pglite"]

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
