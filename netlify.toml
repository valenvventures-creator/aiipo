# Generated by scripts/build-static.js. Static edition only: no accounts or stored data.
[build]
  command = "mkdir -p dist && cp index.html dist/index.html"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-XOavHRj4hk0BQdZHvETsxOizEtRsp4fJAHD49T1P9eU='; style-src 'sha256-Cm6d6bSiDOCpRXK6CJreWo1wZW38iYYUWQBgivL05g4=' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
